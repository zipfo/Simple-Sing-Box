<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seafile</title>
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNTYgMjU2Ij48cmVjdCB3aWR0aD0iMjU2IiBoZWlnaHQ9IjI1NiIgZmlsbD0iIzFFNjlCOCIgcng9IjEyIi8+PHBhdGggZmlsbD0iI2ZmZiIgZD0iTTEyOCA2MGMtMjAgMC0zNiAxNi0zNiAzNnMxNiAzNiAzNiAzNiAzNi0xNiAzNi0zNi0xNi0zNi0zNi0zNnptLTUwIDUwYy0xNCAwLTI1IDExLTI1IDI1czExIDI1IDI1IDI1IDI1LTExIDI1LTI1LTExLTI1LTI1LTI1em0xMDAgMGMtMTQgMC0yNSAxMS0yNSAyNXMxMSAyNSAyNSAyNSAyNS0xMSAyNS0yNS0xMS0yNS0yNS0yNXoiLz48L3N2Zz4=" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #003b6e 0%, #1e69b8 50%, #00a3e0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 180px;
            height: 50px;
            margin: 0 auto;
        }

        .login-wrapper {
            width: 100%;
            max-width: 380px;
            padding: 0 20px;
        }

        .login-card {
            background: #fff;
            border-radius: 4px;
            padding: 36px 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        .card-title {
            font-size: 20px;
            font-weight: 500;
            color: #333;
            margin-bottom: 28px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #666;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.2s ease;
            outline: none;
            color: #333;
        }

        .form-group input:focus {
            border-color: #1e69b8;
            box-shadow: 0 0 0 2px rgba(30, 105, 184, 0.15);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .submit-btn {
            width: 100%;
            padding: 11px 20px;
            background: #1e69b8;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .submit-btn:hover {
            background: #175aa0;
        }

        .submit-btn:active {
            background: #134b85;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            accent-color: #1e69b8;
        }

        .forgot-link {
            color: #1e69b8;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .footer-links a {
            color: #fff;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="logo-header">
        <svg class="logo" viewBox="0 0 220 50" xmlns="http://www.w3.org/2000/svg">
            <!-- Seafile logo: seahorse/cloud icon -->
            <g transform="translate(0, 5)">
                <circle cx="20" cy="20" r="8" fill="#fff"/>
                <circle cx="35" cy="15" r="10" fill="#fff"/>
                <circle cx="50" cy="20" r="8" fill="#fff"/>
                <circle cx="35" cy="28" r="6" fill="#fff"/>
            </g>
            <!-- Text -->
            <text x="65" y="32" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#fff">Seafile</text>
        </svg>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <h2 class="card-title">Sign In</h2>

            <form onsubmit="return false;">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Email" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
            </form>
        </div>

        <div class="footer-links">
            <a href="#">Sign up</a> &middot; <a href="#">Contact us</a>
        </div>
    </div>
</body>
</html>
